# GPU overlay. Replaces only the worker; everything else is unchanged.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Requires the NVIDIA Container Toolkit on the host. Check it first:
#   docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu24.04 nvidia-smi
#
# On Windows this works through Docker Desktop with the WSL2 backend.

services:
  worker:
    build:
      dockerfile: docker/worker.gpu.Dockerfile
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
