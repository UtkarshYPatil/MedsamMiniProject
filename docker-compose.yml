# Full stack, CPU only -- runs on any machine with Docker, no GPU and no
# dataset required.
#
#   docker compose up --build
#   open http://localhost:8501        UI
#   open http://localhost:8000/docs   API
#
# Before starting, put MedSAM2_CTLesion.pt in ./checkpoints -- the weights are
# research-and-education-use only and are deliberately not baked into the image.
# Without it the worker refuses to start and says so.
#
# To demonstrate the stack with no checkpoint and no dataset, set DRY_RUN=1 and
# create a phantom case from the sidebar. Every number produced that way is
# labelled a dry run, in the API response and in the UI, because it is made up.
#
# For GPU, overlay the second file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

name: nodule-assistant

x-worker-env: &worker-env
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  QUEUE_NAME: segmentation
  CHECKPOINT: /app/checkpoints/MedSAM2_CTLesion.pt
  MODEL_CFG: configs/sam2.1_hiera_t512.yaml
  DRY_RUN: ${DRY_RUN:-0}
  JOB_TIMEOUT: ${JOB_TIMEOUT:-600}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodule}
      POSTGRES_DB: ${POSTGRES_DB:-nodule}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodule}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ${REGISTRY:-ghcr.io/utkarshypatil}/nodule-api:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nodule}:${POSTGRES_PASSWORD:-nodule}@db:5432/${POSTGRES_DB:-nodule}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      QUEUE_NAME: segmentation
      DEVICE: ${DEVICE:-auto}
      DRY_RUN: ${DRY_RUN:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-64}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - data:/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-ghcr.io/utkarshypatil}/nodule-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      <<: *worker-env
      DEVICE: ${DEVICE:-auto}
    volumes:
      - data:/data
      - ./checkpoints:/app/checkpoints:ro
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    # Scale horizontally -- they share one queue and need no coordination:
    #   docker compose up --scale worker=4

  ui:
    image: ${REGISTRY:-ghcr.io/utkarshypatil}/nodule-ui:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  data:
